pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,tsx}"
      run: npx eslint --fix --max-warnings=0 {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,css,json,md,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    secrets:
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  commands:
    check:
      run: npm run typecheck && npm run test
